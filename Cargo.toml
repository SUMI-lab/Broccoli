[package]
name = "broccoli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plotlib = "0.5.1"
clap = { version = "4.4.8", features = ["derive"] }
rand = { version = "0.8.5", features = ["small_rng"] }
pyo3 = { version = "0.28.0", features = ["experimental-inspect"] }
numpy = "0.28.0"

[lib]
name = "broccoli_python"
crate-type = ["cdylib"]

[[bin]]
name = "broccoli"